server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    # Balena terminates TLS without forwarding a trustworthy protocol header.
    # HSTS upgrades future browser visits; login.js upgrades the first HTTP visit.
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 8k;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # Always overwrite this marker. The API must never treat tunnel traffic
        # as the trusted localhost touchscreen, even with a forged Host header.
        proxy_set_header X-Testbench-Public "1";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Forwarded-Proto "";
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
