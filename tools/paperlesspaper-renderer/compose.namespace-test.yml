# Explicit opt-in test configuration; not the default deployment.
services:
  renderer:
    extends:
      file: ./compose.development.yml
      service: renderer
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      - seccomp=./security/seccomp.chromium.json
    # A failed sandbox probe must not restart indefinitely during diagnosis.
    restart: "on-failure:3"
volumes:
  renderer-socket:
    name: paperlesspaper-dev-renderer-socket
networks:
  renderer-egress:
    driver: bridge
