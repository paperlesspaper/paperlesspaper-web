services:
  renderer:
    build:
      context: ../..
      dockerfile: Dockerfile.paperlesspaper-renderer
    restart: unless-stopped
    # Keep Docker's default security policies; never grant SYS_ADMIN here.
    # Host-specific namespace restrictions must be diagnosed before rollout.
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node:size=64m,uid=1000,gid=1000,mode=700
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    volumes:
      - renderer-socket:/run/paperlesspaper-renderer
    # Dedicated outbound network. No Dokploy/database network and no published ports.
    networks:
      - renderer-egress
volumes:
  renderer-socket:
    name: paperlesspaper-dev-renderer-socket
networks:
  renderer-egress:
    driver: bridge
