services:
  renderer:
    build:
      context: ../..
      dockerfile: Dockerfile.paperlesspaper-renderer
    restart: unless-stopped
    # Chromium needs namespace creation on the current development host.
    # This exception is ONLY for the renderer, never the API. Keep the Chromium sandbox enabled.
    cap_add:
      - SYS_ADMIN
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /home/node:size=64m,uid=1000,gid=1000,mode=700
    shm_size: 256mb
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    volumes:
      - renderer-socket:/run/paperlesspaper-renderer
    # Dedicated outbound network. No Dokploy/database network and no published ports.
    networks:
      - renderer-egress
volumes:
  renderer-socket:
    name: paperlesspaper-dev-renderer-socket
networks:
  renderer-egress:
    driver: bridge
